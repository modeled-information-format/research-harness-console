# katex 0.16.47 in the lockfile (and 0.16.45 bundled inside mermaid.min.js,
# which is the copy the renderer actually executes), CVSS 2.1 (low). Pulled in
# only by mermaid 11.16.1, which pins katex ^0.16; the fix is 0.18.2, outside
# that range. Report markdown can reach KaTeX through mermaid diagrams in the
# renderer, but exploiting this requires Object.prototype to already be
# polluted by some other bug (KaTeX itself does not enable the pollution), and
# mermaid runs with securityLevel: 'strict'.
# Remove this entry once mermaid ships a release (package range *and* rebuilt
# dist bundle) with katex >= 0.18.2.
reason = "Low-severity katex advisory that requires pre-existing prototype pollution; only reachable through mermaid, which pins katex ^0.16 (fix is 0.18.2). Revisit when mermaid bumps katex."

# OSV-Scanner configuration.
#
# Accepted, justified vulnerability exceptions. Each entry is a deliberate risk
# decision, not a silent suppression: no in-range fix exists, and the
# vulnerable code path is either build-time only or unreachable from this
# app's inputs. Everything that had an in-range fix was upgraded instead.
# Revisit on every dependency bump; remove an entry as soon as a fix lands.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
# braces 3.0.3: stack-exhaustion DoS on deeply nested brace patterns. No fixed
# release exists (3.0.3 is the latest). Runtime transitive via chokidar 3.6.0,
# whose only braces call is braces.expand() on a watch path when globbing is
# enabled. server/bridge.js now passes `disableGlobbing: true`, so the harness
# root (which can arrive via POST /api/config in standalone server mode) is
# treated as a literal path and never reaches braces. Remove this entry once
# braces ships a fix or chokidar is upgraded to v4+ (which drops braces).
reason = "No fixed braces release exists; only call site is chokidar's glob expansion of the watch path, disabled via disableGlobbing: true in server/bridge.js, so no input reaches it. Revisit when braces ships a fix or chokidar moves to v4."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
# sprintf-js <= 1.1.3: uncaught RangeError when an attacker controls the
# *format string* (unbounded precision specifier). No fixed release exists.
# Two copies, neither takes untrusted format strings:
#   - 1.0.3 (runtime): gray-matter -> js-yaml 3.15.2 -> argparse 1.0.10 ->
#     sprintf-js. argparse is used only by js-yaml's CLI (bin/js-yaml.js),
#     never by the js-yaml library gray-matter loads, so it is never executed.
#   - 1.1.3 (dev): electron-builder -> @electron/get -> global-agent -> roarr,
#     build-time logging with roarr's own format strings; not packaged.
# Remove this entry once sprintf-js ships a fix or gray-matter drops js-yaml 3.
reason = "No fixed sprintf-js release exists; exploit needs an attacker-controlled format string. Runtime copy is only reachable via js-yaml's CLI (never executed by gray-matter); dev copy is electron-builder build-time logging with fixed format strings."

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
# katex 0.16.47, CVSS 2.1 (low). Pulled in only by mermaid 11.16.1, which pins
# katex ^0.16; the fix is 0.18.2, outside that range. Report markdown can reach
# KaTeX through mermaid diagrams in the renderer, but exploiting this requires
# Object.prototype to already be polluted by some other bug — KaTeX itself does
# not enable the pollution — and mermaid runs with securityLevel: 'strict'.
# Remove this entry once mermaid accepts katex >= 0.18.2.
reason = "Low-severity katex advisory that requires pre-existing prototype pollution; only reachable through mermaid, which pins katex ^0.16 (fix is 0.18.2). Revisit when mermaid bumps katex."

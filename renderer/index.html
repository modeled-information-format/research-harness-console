<style>
  html, body { margin: 0; height: 100%; }
  body { min-height: 100vh; }
  #root { height: 100vh; }

  /* Reading pane for rendered report markdown (see ReportsView.jsx, window.marked) */
  .mif-report-body h1, .mif-report-body h2, .mif-report-body h3, .mif-report-body h4 {
    font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.02em;
    color: var(--text); margin: 1.6em 0 0.6em;
  }
  .mif-report-body h1 { font-size: 1.5rem; }
  .mif-report-body h2 { font-size: 1.2rem; }
  .mif-report-body h3 { font-size: 1.02rem; }
  .mif-report-body p { margin: 0 0 1em; color: var(--text-2); }
  .mif-report-body a { color: var(--machine); }
  .mif-report-body code { font-family: var(--font-mono); background: var(--overlay); padding: 0.1em 0.4em; border-radius: var(--radius-sm); font-size: 0.9em; }
  .mif-report-body pre { background: var(--overlay); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1em; overflow-x: auto; }
  .mif-report-body pre code { background: none; padding: 0; }
  .mif-report-body blockquote { border-left: 3px solid var(--human); margin: 1em 0; padding: 0.2em 0 0.2em 1em; color: var(--text-2); }
  .mif-report-body ul, .mif-report-body ol { color: var(--text-2); padding-left: 1.4em; margin: 0 0 1em; }
  .mif-report-body li { margin: 0.3em 0; }
  .mif-report-body hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .mif-report-body table { border-collapse: collapse; width: 100%; margin: 0 0 1.2em; font-size: 0.88rem; }
  .mif-report-body th, .mif-report-body td { border: 1px solid var(--border); padding: 0.45em 0.7em; text-align: left; }
  .mif-report-body th { background: var(--elevated); color: var(--text); font-family: var(--font-mono); font-size: 0.78rem; }
  .mif-report-body td { color: var(--text-2); }
  .mif-mermaid { display: flex; justify-content: center; margin: 0 0 1.2em; overflow-x: auto; }
  .mif-mermaid svg { max-width: 100%; }
</style>
</head>
<body>

</body>
